# Shopify calls this function with its own HMAC signature, NOT a Supabase JWT —
# so JWT verification must be off (we verify the Shopify signature ourselves).
[functions.shopify-webhook]
verify_jwt = false

# The retry worker is called by a scheduler (not a user), gated by RETRY_SECRET —
# so JWT verification is off here too.
[functions.wa-retry]
verify_jwt = false
